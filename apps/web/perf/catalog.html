<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The same viewport metadata the play `index.html` and the stress page carry (#148) —
         see `perf/index.html` for why it is load-bearing on a device rather than cosmetic. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The CATALOG scene's perf page (M2-S11 P7). A SECOND page beside `index.html`,

         one never loads the other's bundle, and so `vite.perf.config.ts` can name both
         as rollup inputs without either scene's content reaching the other's graph.
         Perf-only, never shipped — see `vite.perf.config.ts`'s header. -->
    <title>Wynding perf harness — catalog scene</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main-perf-catalog.ts"></script>
  </body>
