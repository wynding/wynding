apply plugin: 'com.android.application'

// =====================================================================================
// RELEASE SIGNING (#137).
//
// NO KEY MATERIAL IS EVER WRITTEN IN THIS FILE. This repository is public, and an upload
// or app-signing key that reaches a public remote cannot be rotated — only abandoned,
// stranding every install that was ever signed with it. If a signing problem tempts you
// to paste a password here to "just get a build out", that is the accident this block
// exists to prevent; the fix is always to supply the values below out of band.
//
// TWO SOURCES, environment first. The environment wins so a value can be supplied for one
// invocation without touching the disk at all; `keystore.properties` is the fallback for
// a developer machine where typing four variables every time is the thing that leads to a
// shell-history leak. That file lives beside this project at
// `apps/mobile/android/keystore.properties`, is named in `android/.gitignore` (a rule
// this repo deliberately UNCOMMENTED from the stock template), and
// `scripts/check-native-invariants.mjs` asserts both that the ignore rule survives a
// regeneration and that no literal password reaches this file.
//
// NOT `local.properties`: Android Studio owns that file and rewrites it with the SDK path,
// so credentials there are one IDE action away from being clobbered — and it is not the
// file the keystore ignore rules already name.
//
// WITHOUT ANY OF IT, the release build still CONFIGURES — CI has no keystore and must not
// fail at configuration time — and then fails loudly at assemble time rather than quietly
// emitting an unsigned APK that looks like a shippable one.
// =====================================================================================
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream -> keystoreProperties.load(stream) }
}

def signingValue = { envName, propertyName ->
    def fromEnv = System.getenv(envName)
    return (fromEnv != null && !fromEnv.isEmpty()) ? fromEnv : keystoreProperties.getProperty(propertyName)
}

def releaseStoreFile = signingValue('WYNDING_KEYSTORE_FILE', 'storeFile')
def releaseStorePassword = signingValue('WYNDING_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('WYNDING_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('WYNDING_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = releaseStoreFile != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

android {
    namespace = "net.wynding.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.wynding.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // `null` rather than a half-filled config: an unsigned release is a legitimate
            // configuration-time state (CI, a fresh clone), and the assemble-time guard
            // below is what stops one being mistaken for a shippable build.
            signingConfig hasReleaseSigning ? signingConfigs.release : null
        }
        // =============================================================================
        // The PERF variant (#148) — the instrument #141 measures with.
        //
        // A BUILD TYPE, not a config override and not a second native project. `cap add`
        // bakes `applicationId` into this file once and editing `capacitor.config.ts`
        // afterwards re-stamps nothing (that file says so itself), so the only honest way
        // to get a second installable identity out of one project is here.
        //
        // `.perf` is what makes it install ALONGSIDE the play build rather than replacing
        // it — the point of the exercise, since a measurement you cannot compare against
        // the shipped app is not a measurement of the shipped app.
        //
        // `initWith debug` inherits debug SIGNING and `debuggable true`, which is what
        // makes `adb install` work with no key material and what lets the WebView be
        // inspected. It is deliberately NOT derived from `release`: a perf build is never
        // distributed, and giving it release signing would put the real key in the path of
        // a routine measurement run.
        //
        // WHAT THIS DOES NOT DO is choose the payload. `src/main/assets/public` is shared
        // with the play build, so the pairing is enforced by the COMMANDS instead — both
        // `release:android` and `perf:android` sync their own artifact first, so neither
        // can package the other's leftovers.
        // =============================================================================
        perf {
            initWith debug
            applicationIdSuffix ".perf"
            versionNameSuffix "-perf"
            matchingFallbacks = ['debug']
        }
    }
}

// Fail at ASSEMBLE time, not configuration time. `pnpm run check:native`, `./gradlew tasks`
// and an Android Studio sync all configure this project on machines that have no keystore
// and want none; only an actual attempt to produce a release artifact needs one. The
// messages name the fix so each failure is self-servicing.
//
// The second check closes the ONE footgun the perf variant (#148) introduces. Both
// variants package from the same `src/main/assets/public` slot, so a release assembled
// straight after a perf sync would ship the perf HARNESS as the game — the
// silently-wrong-artifact shape ADR 0013 exists to narrow, and a raw `./gradlew
// assembleRelease` bypasses the npm scripts that otherwise keep the pairing honest (each
// stages its own artifact first). `sync-perf.mjs` is the only thing that writes an
// `android` block into the staged `capacitor.config.json`, and `cap sync` — the play
// path — never does, so its presence is an exact, mechanical answer to "which payload is
// staged right now?".
def stagedCapacitorConfig = file("src/main/assets/capacitor.config.json")

tasks.matching { task ->
    (task.name.startsWith('assemble') || task.name.startsWith('bundle')) &&
            task.name.contains('Release')
}.configureEach { task ->
    task.doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException(
                "No release signing material. Supply WYNDING_KEYSTORE_FILE, " +
                "WYNDING_KEYSTORE_PASSWORD, WYNDING_KEY_ALIAS and WYNDING_KEY_PASSWORD in the " +
                "environment, or the same four as storeFile/storePassword/keyAlias/keyPassword " +
                "in apps/mobile/android/keystore.properties (untracked). See apps/mobile/README.md " +
                "— 'Release signing'. NEVER commit any of it: this repository is public."
            )
        }
        // The README requires an ABSOLUTE storeFile, and this is what makes that a rule
        // rather than advice. A relative path resolves against `android/app/`, which is
        // almost never where anyone keeps a keystore — so the honest outcomes are a
        // confusing "file not found" or, far worse, silently signing with a DIFFERENT
        // keystore that happens to sit at that relative path. A key mismatch only shows up
        // as INSTALL_FAILED_UPDATE_INCOMPATIBLE on a player's device, long after release.
        if (!new File(releaseStoreFile).isAbsolute()) {
            throw new GradleException(
                "Release keystore path must be ABSOLUTE, got '" + releaseStoreFile + "'. " +
                "A relative path resolves against apps/mobile/android/app/, not your working " +
                "directory — and would silently sign with whatever keystore happens to sit " +
                "there. Supply an absolute path in WYNDING_KEYSTORE_FILE or as storeFile in " +
                "apps/mobile/android/keystore.properties. See apps/mobile/README.md — " +
                "'Release signing'."
            )
        }
        if (stagedCapacitorConfig.exists() &&
                stagedCapacitorConfig.text.contains("webContentsDebuggingEnabled")) {
            throw new GradleException(
                "The staged web payload is the PERF artifact, not the Host build: " +
                "src/main/assets/capacitor.config.json declares webContentsDebuggingEnabled, " +
                "which only `pnpm run sync:perf` writes. Assembling a release now would ship " +
                "the perf harness as the game. Re-stage the Host build first:\\n" +
                "  pnpm --filter @wynding/mobile run sync:android\\n" +
                "(or just use `pnpm run release:android`, which does it for you)."
            )
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
