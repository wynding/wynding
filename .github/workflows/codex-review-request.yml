name: Codex review request

# Codex reviews when a PR opens, when a draft goes ready, or when someone comments
# "@codex review" — never on pushes. Pushes are therefore the one gap, and `synchronize`
# is deliberately the only PR trigger here: `opened` and `ready_for_review` self-trigger a
# Codex review already, and this workflow's freshness pre-check cannot see that review
# coming (Codex takes minutes to answer), so subscribing to those events would spend a
# duplicate review nearly every time.
#
# Codex answers "@codex review" only from a GitHub account connected to Codex: posted as
# `github-actions[bot]`, it got "To use Codex here, create a Codex account and connect to
# github" (probe PR #201, 2026-10-12). So the comment is posted with `CODEX_TRIGGER_TOKEN`,
# an Actions secret holding a fine-grained PAT of a connected account (the owner's; #72
# §3), scoped to this repository with Pull requests: read and write. For the workflow's
# own token that is the scope a comment on a pull request takes, where Issues alone is
# refused (A/B probe, run 38308574140); a PAT draws on the same permission sets, and its
# first run confirms it. Without the secret the run warns and posts nothing; once the PAT
# expires its POST fails the job.
#
# If a trigger goes unanswered, `codex-freshness` stays red after the push while this
# workflow reports success. Codex's reply under the trigger says why: none at all, Codex
# ignored it; a refusal (an account not connected, a usage limit), the token's account;
# a verdict the status does not count, check-codex-freshness.mjs's parsing drifted. The
# manual fallback is docs/ai-workflow.md §4. A missed trigger is loud either way — the
# status never goes green on its own.
#
# Same-repo PRs only. The repository is public, `pull_request_target` runs on fork PRs
# without anyone approving the run, and every trigger posts as the owner and spends a
# Codex review: a stranger's PR could otherwise buy one per push. A fork PR's review is
# requested by hand, or by dispatch.
#
# No duplicate-comment guard beyond the freshness pre-check and the concurrency group:
# the only real overlap is a hand-posted trigger racing this workflow, and the cost of
# that race is one redundant review. A guard keyed on comment timestamps would be more
# code than the failure it prevents.
#
# SAFETY INVARIANT: this workflow holds a write-capable token (the PAT, in the last step
# only) and must never check out or execute PR-head code. `pull_request_target` already
# runs in the context of the base repository's default branch; `workflow_dispatch`
# defaults to whatever ref it was aimed at, which CAN be a PR head — the `ref:` pin keeps
# every path on the default branch. Keep it.

on:
  pull_request_target:
    types: [synchronize]
  # Manual lever: re-request a review for a head Codex has not covered. Doubles as a check
  # of the trigger token — but only on a PR whose current head LACKS a verdict; on a fresh
  # head the run posts nothing and exits.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to request a Codex review for
        required: true

# `github.token` only reads: the freshness pre-check reads the PR, its reviews and its
# comments. The comment itself is posted with `CODEX_TRIGGER_TOKEN` (header).
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  request:
    name: codex-review-request
    # draft == false: a draft is not waiting on review, and a review spent on it would be
    # spent again at ready_for_review (which self-triggers Codex). The head repo check is
    # the header's same-repo rule. The dispatch branch
    # enforces the aim-at-main rule (SAFETY INVARIANT): aimed anywhere else, the run is
    # skipped instead of executing that ref's copy. Honest-path tripwire only — a modified
    # ref's copy could drop the guard; the insider boundary is rulesets (docs).
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: codex-review-request-${{ inputs.pr_number || github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check whether the current head lacks a Codex verdict
        id: fresh
        run: |
          set -euo pipefail
          # A missing script, or one that fails to parse, also makes node exit 1 — the same
          # code as a confirmed-stale verdict — so close that overload before it can buy a
          # spurious trigger comment. (Failures once it runs exit 2: the script's own
          # handlers.)
          [ -f scripts/check-codex-freshness.mjs ] || {
            echo "check-codex-freshness.mjs is missing from the default branch" >&2
            exit 2
          }
          node --check scripts/check-codex-freshness.mjs || {
            echo "check-codex-freshness.mjs does not parse" >&2
            exit 2
          }
          ec=0
          node scripts/check-codex-freshness.mjs || ec=$?
          case "$ec" in
            0)
              echo "Current head already has a Codex verdict — no trigger needed."
              echo "stale=false" >> "$GITHUB_OUTPUT"
              ;;
            1) echo "stale=true" >> "$GITHUB_OUTPUT" ;;
            *)
              # Exit 2 = the check could not determine freshness. Do NOT comment on a
              # guess — a flaky API call must not spend a review.
              echo "Could not determine freshness (exit $ec) — not commenting." >&2
              exit "$ec"
              ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      # The PAT is in this step's environment only, and this step runs nothing but `gh`.
      - name: Comment "@codex review" as the trigger token's account
        if: steps.fresh.outputs.stale == 'true'
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CODEX_TRIGGER_TOKEN is not set, so no trigger was posted: Codex answers only an account connected to it (#72 §3). Post '@codex review' manually."
            exit 0
          fi
          # The REST issues endpoint, deliberately not `gh pr comment` — that command
          # posts via GraphQL addComment, whose scope mapping is murkier. Under `set -e` a
          # failed POST (an expired PAT, a missing scope) ends the step with gh's own error.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body='@codex review'
          echo "Requested a Codex review of the new head."
        env:
          GH_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
