name: CI

# Automated gate. Runs the same `verify` contributors run locally: Prettier check
# and the root guards (i18n, dependabot config, glossary, scripts lint), then
# Turbo-orchestrated typecheck + lint + test across the workspace, then a build
# smoke gate. Every CI run is cold — there is no cross-run `.turbo` cache or
# remote cache configured, so each run recomputes every package.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege — CI only reads the repo to install, lint, and test.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (format, typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      # Build smoke gate — compile every package/app so a build-only breakage is
      # caught here rather than in a deploy. Artifacts are NOT uploaded; this is a
      # gate, not a release step.
      - run: pnpm run build
      # Client/server ruleset artifact parity (M2-S11 P6 leg 1, Codex PR #93 P2):
      # byte+hash-compares the client bundle's embedded ruleset against the packaged
      # server copy, over BUILT artifacts. Deliberately not part of the turbo `test`
      # task (test depends only on ^typecheck — it would read stale dist); it re-invokes
      # the build itself, which is a turbo cache hit right after the step above.
      - run: pnpm run check:artifact-parity
      # Initial-load budget gate (ADR 0005): the built app's initial JS must be
      # ≤ 3 MB gzipped. Runs after the build so the dist output exists.
      - run: pnpm run size

  # The repo's whole functional-UI gate, carrying the ADR 0003 §3 accessibility audit:
  # the full Playwright e2e suite (placement, touch, layouts, run lifecycle, the #98
  # webkit arm) plus axe-core against the real DOM UI, failing on any violation. Named
  # for what it covers (#106 — the old "a11y e2e (axe-core)" name undersold that any
  # broken e2e reddens it, not just an axe finding). Branch protection requires this
  # job's NAME as a context — renaming it again means re-doing that wiring in the same
  # change, or every merge wedges on a permanently-pending context.
  a11y-e2e:
    name: e2e (functional + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wynding/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @wynding/web run e2e
      # Layering reachability over BUILD OUTPUT (#129): no file the shipped web build emits
      # may carry a marker of @wynding/perf or the never-shipped @wynding/content/stress and
      # /catalog bundles. It lives HERE, not in `verify`, because it needs three real Vite
      # builds and this is already the longest job — the fast unit path stays fast. (An
      # earlier note said "this job already pays for two of them", which does no work as a
      # reason: `verify`'s `pnpm run build` pays for the same two, and the script rebuilds all
      # three itself regardless, deliberately never trusting an existing dist. The marginal
      # cost is three builds wherever it sits.) Runs after `e2e` rather than before so a
      # functional regression is reported as a functional regression.
      #
      # THIS STEP IS WHY THE JOB'S NAME NOW UNDERSELLS IT, and that is a known, accepted debt
      # rather than an oversight. `e2e (functional + axe)` is a REQUIRED context, so a layering
      # violation is merge-blocking here — which is the point, and which is exactly what would
      # be lost by moving this into a job of its own. Renaming the context means re-wiring
      # branch protection in the same change (see the note above at the job header), so it is
      # left to an owner pass. The step carries an explicit `name:` so a red run says
      # "layering", not "Playwright".
      #
      # This is the only guard that answers the reachability question against the real module
      # graph. `eslint.config.mjs`'s layering zones and `packages/perf/src/layering.test.ts`
      # run in `verify` and catch the specifier-shaped cases earlier and cheaper; the six PATH
      # escapes in #129's table, and the template literal `layering.test.ts` leaves open by
      # design, are caught only here — with the caveat the script's own header states, that a
      # marker must survive tree-shaking to be seen.
      - name: layering reachability over build output (#129 — not a Playwright failure)
        run: pnpm run check:build-layering
      # Failure forensics ONLY (the no-artifact stance in the comment above is about build
      # outputs): Playwright's per-failure error-context page snapshots and on-first-retry
      # traces are the difference between diagnosing a Linux-only failure from the log tail
      # and guessing at it. Exists solely when the gate is already red — which, since the
      # layering step above joined this job, can also mean a red that produced no Playwright
      # output at all. `if-no-files-found: ignore` makes that upload a harmless no-op.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Performance gate (ADR 0005 §Validation, M2-S4b): runs the seeded stress scenario —
  # ~300 concurrent creeps, 150 towers, blasts and slows live — and fails on two things.
  # First the WORKLOAD ORACLE: a passing perf run proves nothing about what it measured,
  # because `placeTower` with insufficient bounty is a deterministic no-op and `step()`
  # freezes on a terminal phase, so a mis-authored scenario measures an almost-empty or
  # wholly inert sim and posts superb percentiles. The oracle asserts the scene is the
  # one the ADR describes before any timing is believed. Then the RELATIVE GATE: the
  # ratio of the stress run's p50 `step()` over its due-blast ticks to a blast-free
  # control workload's p50, run in the same process, so a slow or noisy runner scales
  # both terms and cancels out. BOTH ARMS ARE MEDIANS as of M2-S6 (the numerator was p99
  # until M2-S5b P11, then p95 until M2-S6) — the cancellation only works when the two
  # terms are alike in robustness; see `packages/perf/src/gate.ts`'s `stressStat`.
  #
  # Its own job, NOT part of `verify` (PLAN M2-S4b step 20) — though not for the reason
  # the plan assumed: the full two-scenario run measures ~4.6s (each arm now traverses
  # the sim TWICE, `harness.ts`'s timed/untimed split from M2-S5b P10 — this figure was
  # ~2.3s before that split), not the "minutes" the plan predicted, so cost is not what
  # keeps it out. What keeps it out is that a timing
  # measurement inside `verify` would be run on whatever the developer's machine happens
  # to be doing, and a gate that flaps locally is a gate people learn to ignore. Anyone
  # can still run it directly: `pnpm run perf`.
  #
  # Invoked through pnpm rather than turbo on purpose — turbo would cache the task on an
  # unchanged input hash, and a cached perf run measures nothing at all. `pnpm -C` rather
  # than `pnpm --filter`: a `--filter` that matches NO package prints "No projects matched
  # the filters" and exits **0** (verified on pnpm 10.33.0), so renaming this package or
  # moving it out of the workspace glob would turn this job green having measured nothing.
  # `-C` exits non-zero on a missing directory.
  #
  # EVERY oracle assertion fails this job on its own merits — `KNOWN_OPEN_ASSERTIONS`
  # is empty as of the owner ruling of 2026-07-31, which re-pinned the route-length
  # floor to the measured 329 and retired the waived 600 (ADR 0005 finding 2). A red
  # run here is a real finding: do NOT read a route-length failure as the expected
  # waived shortfall, which is what this comment used to describe. A stale waiver —
  # a name on that list whose assertion has started passing — also fails, deliberately.
  # Renamed 2026-08-22 (#114) for what the job now covers — the catalog oracle joined it, and a
  # job named for two of its three checks is the same undersold-name defect #106 fixed on the
  # e2e job. Safe to rename here where it was not there: `perf` is deliberately NOT a required
  # check (stated in this job's own R0-guard note below and in `performance-spike.md`'s harness table),
  # so no branch-protection context names it. Re-check that before renaming it again.
  perf:
    name: perf (stress + catalog oracles, step() ratio gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `set -o pipefail` is REQUIRED: GitHub's default shell here is `bash -e {0}`, which
      # does NOT set pipefail, so piping `perf` into `tee` would discard its exit code and
      # turn every gate failure green. The log is teed rather than re-run because the guard
      # below must read the SAME run's report, not a second measurement of it.
      - name: perf (oracle + ratio gate)
        run: set -o pipefail && pnpm run perf | tee "$RUNNER_TEMP/perf.log"
      # AN UNENFORCED GATE ON `main` MUST BE LOUD. Read this as an alarm, not a block: the
      # `push` trigger fires AFTER a merge lands, and this job is not a required check, so
      # what follows detects the state and turns it red — it cannot prevent it. Blocking
      # would mean failing the pull request, which would fail the very PR collecting the
      # baseline samples. `R0 = null` is a legitimate, deliberate state
      # while a statistic change is being re-baselined: `gate.ts`'s `'unset'` arm REPORTS R
      # and exits zero, so the PR collecting the samples is not blocked by the gate it is
      # collecting them for. The hazard is that this state is GREEN — nothing in the test
      # suite goes red for it (see `gate.test.ts`'s `R0` block) — so a merge-and-forget
      # would leave the perf gate permanently unenforced with no signal anywhere.
      #
      # This job runs on `push` only for `main` (see `on:` at the top), so gating the check
      # on the event is exactly "is this the default branch". It costs nothing while `R0` is
      # a number, and it cannot rot: there is no waiver list to remember to empty, and it
      # self-retires the moment the baseline is recorded. Considered and rejected in favour
      # of this: registering the unset state on `KNOWN_OPEN_ASSERTIONS`, which would fire on
      # restore rather than on forgetting, and needs its own cleanup commit.
      #
      # PARSED, not grepped, and it FAILS CLOSED. A `grep '"r0":null'` was the first draft and
      # had two holes: it depends on `JSON.stringify`'s exact spacing (`"r0": null` would slip
      # through), and a missing or truncated log makes `grep` exit non-zero, which reads as
      # "no null found" and passes the guard silently — a false PASS in the one place that
      # must not have one. Parsing the report and treating an absent line as a failure closes
      # both. Do not revert this to a grep.
      #
      # NOTE ON QUOTING, since it is load-bearing and invisible: the script is delimited by
      # single quotes, so it must contain NONE. That is why the message below says
      # "gate.ts R0 doc" and not "gate.ts's R0 doc" — one apostrophe would terminate the
      # argument and change what runs. The backticks and `${r0}` are a JS template literal;
      # bash does not expand inside single quotes and `${` is not GitHub's `${{`, so both
      # reach Node intact. Re-check all three if you edit this script.
      - name: the gate must be ENFORCED on main (R0 recorded, not null)
        if: github.event_name == 'push'
        env:
          PERF_LOG: ${{ runner.temp }}/perf.log
        run: |
          node -e '
            const line = require("fs")
              .readFileSync(process.env.PERF_LOG, "utf8")
              .split("\n")
              .find((l) => l.startsWith("PERF-REPORT: "));
            if (!line) {
              console.log("::error::no PERF-REPORT line in the perf log — cannot confirm the gate is enforced.");
              process.exit(1);
            }
            let r0;
            try {
              ({ r0 } = JSON.parse(line.slice("PERF-REPORT: ".length)));
            } catch (e) {
              console.log("::error::PERF-REPORT line is not valid JSON — cannot confirm the gate is enforced.");
              console.log(String(e && e.message));
              process.exit(1);
            }
            if (typeof r0 !== "number" || !Number.isFinite(r0) || r0 <= 0) {
              console.log("::error::R0 is not a usable baseline on main — the perf gate is REPORTING, not enforcing.");
              console.log("Saw: " + JSON.stringify(r0) + ". Record a baseline per the procedure in gate.ts R0 doc.");
              process.exit(1);
            }
            console.log(`perf gate is enforced on main: R0 = ${r0}`);
          '
      # The catalog scene's LIVE-RUN ORACLE (#114): `runCatalogScene` + `catalogAssertions`
      # over real simulated state — the engagement floors, the observed detonation ticks, the
      # real leak probe, a tower count held across the window, and replay-validator acceptance.
      # (Row count, tick count and tower count are stated by `oracle-catalog.ts` and
      # `layout.ts`; they are not restated here, because a figure copied into a second file is
      # the drift `packages/perf/src/claims.ts` exists to catch.) Its STRUCTURAL invariants were
      # already gated by `verify` (layout-catalog.test.ts, oracle-catalog.test.ts, content's
      # catalog.test.ts); the live run was wired to no workflow and no hook, so a live-oracle
      # regression was invisible until someone typed the command. Precedent for wiring exactly
      # this class: `check:artifact-parity` above, added in PR #93 because it was "wired into no
      # workflow, so the drift class could merge green".
      #
      # LAST IN THE JOB, AND UNCONDITIONAL — the position and the `if:` do different halves of
      # the same job, and an earlier version of this comment claimed the position alone was
      # "load-bearing in both directions", which was only half true.
      #
      #   POSITION. Never before the timed `perf` step: a 6,000-tick run ahead of it would load
      #   the runner at exactly the moment timing is being measured. And after the R0 guard,
      #   not between: that guard is the alarm for an unenforced gate on `main`, and a red
      #   catalog oracle must not be what silences it.
      #
      #   `if: ${{ !cancelled() }}`. Without it, a failed earlier step SKIPS this one, and both
      #   ways that happens are ways the trustworthy signal would be lost to an untrustworthy
      #   one. The timed `perf` step is the single step in this repo whose flake ADR 0005
      #   records and accepts — so a flake there would suppress the oracle that cannot flake.
      #   And `R0 = null` is a legitimate, deliberate state during a re-baseline, in which the
      #   guard above fails every push to `main`: catalog coverage on the default branch would
      #   drop to zero for the duration. Cancellation is still honoured, so a superseded run
      #   stops promptly.
      #
      # Separate `pnpm` invocations, so ADR 0005's process-isolation requirement is satisfied
      # the same way it already is for `perf` itself.
      #
      # A RED HERE IS ALWAYS A REAL REGRESSION, even though the job as a whole is advisory
      # (the owner's `perf` ruling). The flap rationale that keeps the timed ratio advisory does
      # not apply to this step: `run-catalog.ts` reads no clock and draws no ambient randomness
      # (its header says so, and `oracle-catalog.ts` is one untimed state-derived pass), so it
      # cannot flap. Measured at 3.8s wall on an idle dev machine — cheaper than the ~4.6s timed
      # run beside it.
      - name: catalog scene live-run oracle (deterministic — a red here is real)
        if: ${{ !cancelled() }}
        run: pnpm run perf:catalog

  # Determinism gate, part 2: the sim's golden world-hash (determinism.test.ts) is
  # pinned to SIM_VERSION. A runtime test can't enforce that a golden *change* is
  # paired with a version bump, so this PR-only job diffs the golden against the
  # base branch and fails if it changed AND a non-test packages/sim/src/ file also
  # changed in the same diff, while SIM_VERSION did not increase. (The sim-source
  # axis, not a "rulesets/*.json changed" exemption — #107 checked the exemption
  # against history and rejected it: every recent sim-behavior commit also touches
  # wynding-core.json, so it would be open on essentially every substantive PR.)
  # See scripts/check-determinism-version.mjs for the full trigger, the fail-closed
  # base-ref handling, and the residual trade-offs it states plainly.
  #
  # ADVISORY BY DECISION, not by default — ruled 2026-08-13 (owner, #107), recorded
  # in the same register as the `perf` ruling above and in docs/milestones/m2.md's
  # "Open questions / first-pass flags".
  #
  # It does not flap the way `perf` can — it measures nothing, it is a diff over
  # committed text — but the hardening in #107 deliberately ADDS two fail-closed
  # exits (an unresolvable base ref, and a failed `git diff`), and one of them sits
  # behind a NETWORK fetch. So "cannot flap" would be too strong a claim to make
  # here, and an earlier draft of this comment made it. What is true: any red it
  # produces is either a real finding or an infrastructure failure that should be
  # loud, never a threshold that drifted. The reason it stays advisory is the
  # owner's call, not a technical one. This ruling does NOT add the job to branch
  # protection's required contexts — do not do so without a fresh owner ruling
  # recorded here.
  # What would change the decision: the owner deciding the job's track record (or a
  # concrete miss it would have caught) justifies making it required.
  determinism-version:
    name: determinism golden ↔ SIM_VERSION
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a SIM_VERSION bump when the determinism golden changes
        run: node scripts/check-determinism-version.mjs
        env:
          # The event's exact base commit — immune to main advancing mid-run.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
